<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey:            "AIzaSyA4f818BjasXWSz2tHu2u1bX0NOA12I1eM",
  authDomain:        "noblelink.firebaseapp.com",
  databaseURL:       "https://noblelink-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "noblelink",
  storageBucket:     "noblelink.firebasestorage.app",
  messagingSenderId: "542107907290",
  appId:             "1:542107907290:web:135dc715458550d27d21e3"
};

let db = null;
let useFirebase = false;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  useFirebase = (firebaseConfig.apiKey !== "여기에_API_KEY");
} catch(e) { console.warn('Firebase 미설정, localStorage 사용'); }

/* ════════════════════════════════════════════
   STORAGE LAYER (Firebase → localStorage fallback)
   ════════════════════════════════════════════ */
const store = {
  async get(path) {
    if (useFirebase) {
      const snap = await db.ref(path).get();
      return snap.exists() ? snap.val() : null;
    }
    try { return JSON.parse(localStorage.getItem(path)); } catch { return null; }
  },
  async set(path, val) {
    if (useFirebase) {
      await db.ref(path).set(val);
    } else {
      localStorage.setItem(path, JSON.stringify(val));
    }
  },
  async remove(path) {
    if (useFirebase) await db.ref(path).remove();
    else localStorage.removeItem(path);
  },
  listen(path, cb) {
    if (useFirebase) db.ref(path).on('value', snap => cb(snap.exists() ? snap.val() : null));
  }
};

/* ════════════════════════════════════════════
   UTILS
   ════════════════════════════════════════════ */
const uid   = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc   = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ge    = id => document.getElementById(id);
const toLocal = d => {
  const r=new Date(d);
  return `${r.getFullYear()}-${String(r.getMonth()+1).padStart(2,'0')}-${String(r.getDate()).padStart(2,'0')}`;
};
const todayStr = () => toLocal(new Date());
const dayNum = d => { const [y,m,day]=d.split('-').map(Number); return Math.round(Date.UTC(y,m-1,day)/86400000); };
const toArr = x => Array.isArray(x) ? x.filter(Boolean) : Object.values(x||{});
const DOW = ['일','월','화','수','목','금','토'];
const fmtDate = d => {
  const [y,m,day]=d.split('-').map(Number);
  const dw=DOW[new Date(y,m-1,day).getDay()];
  return `${y}년 ${m}월 ${day}일 (${dw})`;
};
/* 이월 항목 삭제 — 완료 누르기 전까지 업무는 매일 따라다님 */
const CHECKS = [
  {k:'read',     l:'읽음', c:'var(--blue)'},
  {k:'completed',l:'완료', c:'var(--green)'},
  {k:'other',    l:'기타', c:'var(--purple)'},
];
const emptyChecks = () => ({read:false,completed:false,other:false,other_content:''});
const tint = (c,p) => `color-mix(in srgb, ${c} ${p}%, transparent)`;

/* ════════════════════════════════════════════
   THEME
   ════════════════════════════════════════════ */
const THEMES = [
  {k:'green', l:'연두',     sw:'#cfe3b4'},
  {k:'mint',  l:'민트',     sw:'#bfe0da'},
  {k:'beige', l:'베이지',   sw:'#e7dcc0'},
  {k:'forest',l:'짙은녹색', sw:'#223529'},
  {k:'dark',  l:'다크',     sw:'#131528'},
];
function applyTheme(k, save) {
  document.documentElement.setAttribute('data-theme', k);
  if (save) { try { localStorage.setItem('noble_theme', k); } catch(e) {} }
  const meta = ge('meta-theme');
  if (meta) meta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
  ge('theme-pick').innerHTML = THEMES.map(t =>
    `<button class="theme-dot ${t.k===k?'on':''}" style="background:${t.sw};" title="${t.l}" data-a="theme" data-k="${t.k}"></button>`
  ).join('');
}

/* ════════════════════════════════════════════
   STATE
   업무(tasks)는 날짜와 무관한 하나의 목록. 완료 전까지 매일 표시됨.
   ════════════════════════════════════════════ */
let S = {
  date: todayStr(),
  tasks: {},          // id → task
  notice: '',
  ret:  [],
  adding: null,
  editNotice: false,
  draft: {},
};
let lastToday = todayStr();

/* ════════════════════════════════════════════
   TASK STORE (건별 저장 → 3인 동시 사용 시 서로 덮어쓰지 않음)
   ════════════════════════════════════════════ */
async function taskSave(t) {
  S.tasks = {...S.tasks, [t.id]: t};
  setSyncDot('s');
  if (useFirebase) await db.ref('noble/tasks/' + t.id).set(t);
  else localStorage.setItem('noble/tasks', JSON.stringify(S.tasks));
  setSyncDot('ok');
  render();
}
async function taskRemove(id) {
  const n = {...S.tasks}; delete n[id]; S.tasks = n;
  if (useFirebase) await db.ref('noble/tasks/' + id).remove();
  else localStorage.setItem('noble/tasks', JSON.stringify(S.tasks));
  render();
}

/* 기존 날짜별 데이터 → 새 업무 목록으로 1회 이전 (가장 최근 날짜의 미완료 업무) */
async function migrateTasks() {
  const all = await store.get('noble/day');
  const out = {};
  if (all && typeof all === 'object') {
    let latest = null, latestKey = '';
    for (const y of Object.keys(all)) for (const m of Object.keys(all[y]||{})) for (const d of Object.keys(all[y][m]||{})) {
      const key = `${y}-${m}-${d}`;
      if (key > latestKey) { latestKey = key; latest = all[y][m][d]; }
    }
    if (latest) {
      [...toArr(latest.pending_tasks), ...toArr(latest.today_tasks)].forEach(t => {
        if (!t || !t.content || t.checks?.completed) return;
        const id = t.id || uid();
        out[id] = {
          id, content: t.content, at: t.at || new Date().toISOString(),
          created: t.from || latestKey,
          checks: { read:!!t.checks?.read, completed:false, other:!!t.checks?.other, other_content:t.checks?.other_content||'' },
        };
      });
    }
  }
  if (Object.keys(out).length) await store.set('noble/tasks', out);
  await store.set('noble/tasks_migrated', true);
  return out;
}

/* ════════════════════════════════════════════
   LOAD
   ════════════════════════════════════════════ */
async function loadAll() {
  let tasks = await store.get('noble/tasks');
  if (tasks === null) {
    const done = await store.get('noble/tasks_migrated');
    tasks = done ? {} : await migrateTasks();
  }
  const ret = await store.get('noble/returns') || [];
  const noticeData = await store.get('noble/notice');

  S.tasks  = tasks || {};
  S.ret    = toArr(ret);
  S.notice = (typeof noticeData === 'string') ? noticeData : '';

  ge('loader').style.display = 'none';
  ge('body').style.display   = 'block';
  render();

  if (useFirebase) {
    store.listen('noble/tasks', nt => { S.tasks = nt || {}; render(); });
    store.listen('noble/returns', nr => { S.ret = toArr(nr); render(); });
    store.listen('noble/notice', nn => { S.notice = (typeof nn === 'string') ? nn : ''; render(); });
  }
}

async function saveRet(nr) {
  S.ret = nr;
  await store.set('noble/returns', nr);
  render();
}
async function saveNotice(txt) {
  S.notice = txt;
  setSyncDot('s');
  await store.set('noble/notice', txt);
  setSyncDot('ok');
  render();
}
function setSyncDot(s) {
  const el = ge('sync-dot'); if(!el) return;
  if(s==='s'){el.textContent='● 저장중';el.style.color='var(--accent)';}
  else{el.textContent='● SYNC';el.style.color='var(--green)';
    setTimeout(()=>{el.textContent='● SYNC';el.style.color='';},2200);}
}

/* ════════════════════════════════════════════
   DATE ROLLOVER — 앱을 안 끄고 다음날 열어도 날짜 자동 갱신
   ════════════════════════════════════════════ */
function checkRollover() {
  const t = todayStr();
  if (t === lastToday) return;
  const wasViewingToday = S.date === lastToday;
  lastToday = t;
  if (wasViewingToday) {
    S.date = t; S.adding = null; S.editNotice = false;
    ge('date-pick').value = t;
  }
  render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkRollover(); });
window.addEventListener('focus', checkRollover);
window.addEventListener('pageshow', checkRollover);
setInterval(checkRollover, 30000);

/* ════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════ */
function visibleTasks() {
  const D = S.date;
  return Object.values(S.tasks).filter(t => {
    const cr = t.created || '0000-00-00';
    if (cr > D) return false;
    const c = t.checks || {};
    if (!c.completed) return true;                 // 완료 전엔 항상 표시
    return (t.completed_on || cr) >= D;            // 완료한 날까지만 표시
  }).sort((a,b) => {
    const da = a.checks?.completed ? 1 : 0, dbb = b.checks?.completed ? 1 : 0;
    return da - dbb || (a.at||'').localeCompare(b.at||'');
  });
}

function render() {
  const {ret,date,adding,editNotice} = S;
  const isToday = date===todayStr();

  ge('date-lbl').innerHTML = fmtDate(date)
    + (isToday ? '<span class="today-badge">TODAY</span>' : '');

  const rPend = ret.filter(r=>r.status==='pending');
  const rRecv = ret.filter(r=>{
    if(r.status==='received') return true;
    if(r.status==='inspected'){
      const id = r.inspected_at?r.inspected_at.slice(0,10):'';
      return id >= date;
    }
    return false;
  });

  ge('body').innerHTML =
    secNotice(S.notice, editNotice) +
    secTask('미수행 업무', visibleTasks(), 'var(--amber)', adding) +
    secRetPend(rPend, adding) +
    secRetRecv(rRecv);
}

function secTask(title, tasks, color, adding) {
  const isAdd = adding==='tasks';
  return `<div class="sec">
    <div class="sec-hdr">
      <span class="sec-ttl" style="color:${color};">${title}</span>
      <button class="add-btn" style="color:${color};border-color:${color};" data-a="open" data-sec="tasks">+ 추가</button>
    </div>
    ${tasks.length===0&&!isAdd ? '<div class="empty">— 없음 —</div>' : ''}
    ${tasks.map(t=>taskCard(t,color)).join('')}
    ${isAdd ? addForm('tasks',color) : ''}
  </div>`;
}

function taskCard(t, color) {
  const c = t.checks||{};
  const age = t.created ? dayNum(S.date) - dayNum(t.created) : 0;
  const [, cm, cd] = (t.created||'').split('-');
  return `<div class="card ${c.completed?'done':''}" style="border-left-color:${color};">
    <div class="card-row">
      <div class="card-txt">${esc(t.content)}</div>
      <button class="del-btn" data-a="del-task" data-id="${t.id}">×</button>
    </div>
    ${age>0?`<div class="card-meta">▲ ${age+1}일째 · ${+cm}/${+cd} 등록</div>`:''}
    <div class="checks">
      ${CHECKS.map(ck=>{
        const on=!!c[ck.k];
        return `<button class="chk ${on?'on':''}" style="--chk-c:${ck.c};"
          data-a="chk" data-id="${t.id}" data-ck="${ck.k}">${on?'✓ ':''}${ck.l}</button>`;
      }).join('')}
    </div>
    ${c.other ? `<div class="other-wrap">
      <textarea class="other-ta" maxlength="100" data-a="other-ta" data-id="${t.id}"
        placeholder="기타 사항 입력 (최대 100자)">${esc(c.other_content||'')}</textarea>
      <div class="char-cnt">${(c.other_content||'').length}/100</div>
    </div>` : ''}
  </div>`;
}

function addForm(sec, color) {
  return `<div class="form-box" style="border-color:${tint(color,40)};">
    <textarea class="form-ta" id="aip-${sec}" placeholder="내용 입력...">${esc(S.draft['aip-'+sec]||'')}</textarea>
    <div class="form-btns">
      <button class="btn-ok" style="background:${color};" data-a="submit" data-sec="${sec}">추가</button>
      <button class="btn-no" data-a="cancel">취소</button>
    </div>
  </div>`;
}

function secRetPend(tasks, adding) {
  const c='var(--cyan)'; const isAdd=adding==='ret_pend';
  return `<div class="sec">
    <div class="sec-hdr">
      <span class="sec-ttl" style="color:${c};">접수할 반품</span>
      <button class="add-btn" style="color:${c};border-color:${c};" data-a="open" data-sec="ret_pend">+ 추가</button>
    </div>
    ${tasks.length===0&&!isAdd?'<div class="empty">— 없음 —</div>':''}
    ${tasks.map(t=>`<div class="card" style="border-left-color:${c};">
      <div class="card-row">
        <div class="card-txt">${esc(t.content)}</div>
        <button class="del-btn" data-a="del-ret" data-id="${t.id}">×</button>
      </div>
      <div class="checks">
        <button class="recv-btn" data-a="recv" data-id="${t.id}">접수 완료 →</button>
      </div>
    </div>`).join('')}
    ${isAdd?`<div class="form-box" style="border-color:${tint(c,40)};">
      <textarea class="form-ta" id="aip-ret_pend" placeholder="반품 내용 입력...">${esc(S.draft['aip-ret_pend']||'')}</textarea>
      <div class="form-btns">
        <button class="btn-ok" style="background:${c};" data-a="submit" data-sec="ret_pend">추가</button>
        <button class="btn-no" data-a="cancel">취소</button>
      </div>
    </div>`:''}
  </div>`;
}

function secRetRecv(tasks) {
  const c='var(--green)';
  return `<div class="sec">
    <div class="sec-hdr">
      <span class="sec-ttl" style="color:${c};">접수한 반품</span>
    </div>
    ${tasks.length===0?'<div class="empty">— 없음 —</div>':''}
    ${tasks.map(t=>{
      const ins=t.status==='inspected';
      return `<div class="card" style="border-left-color:${ins?'var(--border)':c};${ins?'opacity:.5;':''}">
        <div class="card-txt" style="${ins?'text-decoration:line-through;color:var(--txt3);':''}">${esc(t.content)}</div>
        <div class="checks" style="margin-top:9px;">
          <button class="insp-btn" style="border:1.5px solid ${ins?'var(--border2)':c};color:${ins?'var(--txt3)':c};background:${ins?'transparent':tint(c,16)};"
            data-a="insp" data-id="${t.id}">${ins?'✓ 검수완료':'검수완료'}</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function secNotice(notice, editing) {
  const c='var(--purple)';
  return `<div class="sec">
    <div class="sec-hdr">
      <span class="sec-ttl" style="color:${c};">공지사항</span>
      ${!editing?`<div style="display:flex;gap:6px;">
        <button class="add-btn" style="color:${c};border-color:${c};" data-a="edit-notice">수정</button>
        ${notice?`<button class="add-btn" style="color:var(--red);border-color:var(--red);" data-a="del-notice">삭제</button>`:''}
      </div>`:''}
    </div>
    ${editing?`<div class="form-box" style="border-color:${tint(c,40)};">
      <textarea class="form-ta" id="notice-ta" style="height:80px;" maxlength="300"
        placeholder="공지사항 입력 (최대 300자)">${esc(notice)}</textarea>
      <div class="char-cnt" id="nc">${notice.length}/300</div>
      <div class="form-btns">
        <button class="btn-ok" style="background:${c};" data-a="save-notice">저장</button>
        <button class="btn-no" data-a="cancel-notice">취소</button>
      </div>
    </div>`:`<div class="notice-card">
      ${notice
        ?`<div class="notice-txt">${esc(notice)}</div>`
        :`<div class="empty" style="border:none;padding:6px;">— 없음 —</div>`}
    </div>`}
  </div>`;
}

/* ════════════════════════════════════════════
   EVENTS
   ════════════════════════════════════════════ */
document.addEventListener('click', async e => {
  const b=e.target.closest('[data-a]'); if(!b) return;
  const {a,sec,id,ck} = b.dataset;

  if(a==='theme'){ applyTheme(b.dataset.k, true); render(); return; }

  checkRollover();   // 오래 켜둔 화면에서 입력해도 날짜가 어긋나지 않게

  if(a==='open'){
    S.adding=sec; S.editNotice=false; render();
    setTimeout(()=>{const el=ge('aip-'+sec);if(el)el.focus();},40);
  }
  else if(a==='cancel'){S.adding=null;S.draft={};render();}
  else if(a==='submit'){
    const el=ge('aip-'+sec); const txt=(el?.value||'').trim(); if(!txt)return;
    S.adding=null; S.draft={};
    if(sec==='ret_pend'){
      await saveRet([...S.ret,{id:uid(),content:txt,at:new Date().toISOString(),status:'pending'}]);
    } else {
      await taskSave({id:uid(),content:txt,at:new Date().toISOString(),created:S.date,checks:emptyChecks()});
    }
  }
  else if(a==='del-task'){
    if(!confirm('삭제할까요?'))return;
    await taskRemove(id);
  }
  else if(a==='del-ret'){
    if(!confirm('삭제할까요?'))return;
    await saveRet(S.ret.filter(r=>r.id!==id));
  }
  else if(a==='chk'){
    const cur=S.tasks[id]; if(!cur)return;
    const t={...cur,checks:{...emptyChecks(),...cur.checks}};
    t.checks[ck]=!t.checks[ck];
    if(ck==='other'&&!t.checks.other)t.checks.other_content='';
    if(ck==='completed') t.completed_on = t.checks.completed ? todayStr() : null;
    await taskSave(t);
  }
  else if(a==='recv'){
    await saveRet(S.ret.map(r=>r.id===id?{...r,status:'received',received_at:new Date().toISOString()}:r));
  }
  else if(a==='insp'){
    const r=S.ret.find(r=>r.id===id); if(!r)return;
    const ns=r.status==='inspected'?'received':'inspected';
    await saveRet(S.ret.map(r=>r.id===id?{...r,status:ns,inspected_at:ns==='inspected'?new Date().toISOString():null}:r));
  }
  else if(a==='edit-notice'){
    S.editNotice=true;render();
    setTimeout(()=>{const el=ge('notice-ta');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},40);
  }
  else if(a==='save-notice'){
    const txt=(ge('notice-ta')?.value||'').slice(0,300);
    await saveNotice(txt); S.editNotice=false;
  }
  else if(a==='del-notice'){
    if(!confirm('공지사항을 삭제할까요?'))return;
    await saveNotice(''); S.editNotice=false;
  }
  else if(a==='cancel-notice'){S.editNotice=false;render();}
});

document.addEventListener('blur', async e => {
  const el=e.target; if(!el.matches || !el.matches('[data-a="other-ta"]'))return;
  const {id}=el.dataset; const txt=el.value.slice(0,100);
  const cur=S.tasks[id]; if(!cur)return;
  if((cur.checks?.other_content||'')===txt)return;
  await taskSave({...cur,checks:{...cur.checks,other_content:txt}});
}, true);

document.addEventListener('input', e => {
  const el=e.target;
  if(el.id==='notice-ta'){const nc=ge('nc');if(nc)nc.textContent=el.value.length+'/300';}
  if(el.id && el.id.startsWith('aip-')) S.draft[el.id]=el.value;   // 다른 기기 동기화로 화면이 갱신돼도 입력 유지
  if(el.matches('[data-a="other-ta"]')){
    const sib=el.nextElementSibling;if(sib)sib.textContent=el.value.length+'/100';
  }
});

ge('date-pick').value = S.date;
ge('date-pick').addEventListener('change', e=>{
  if(!e.target.value) return;
  S.date=e.target.value; S.adding=null; S.editNotice=false;
  render();
});

/* ════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════ */
applyTheme(document.documentElement.getAttribute('data-theme') || 'green', false);
loadAll();

// localStorage fallback polling
if(!useFirebase){
  setInterval(async()=>{
    const nt=JSON.parse(localStorage.getItem('noble/tasks')||'null')||{};
    const nr=JSON.parse(localStorage.getItem('noble/returns')||'null');
    let ch=false;
    if(JSON.stringify(nt)!==JSON.stringify(S.tasks)){S.tasks=nt;ch=true;}
    if(nr&&JSON.stringify(nr)!==JSON.stringify(S.ret)){S.ret=nr;ch=true;}
    if(ch&&!S.adding&&!S.editNotice)render();
  },5000);
}
</script>
</body>
</html>
